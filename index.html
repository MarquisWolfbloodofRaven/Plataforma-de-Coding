<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Mechanicus - Forge World IDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#C41E3A', // Vermelho Adeptus Mechanicus
                        secondary: '#D4AF37', // Dourado Imperial
                        dark: {
                            bg: '#0A0A0A', // Preto espacial
                            surface: '#1A1A1A', // Cinza escuro
                            elevated: '#252525', // Cinza médio
                            border: '#333333' // Cinza claro
                        }
                    },
                    fontFamily: {
                        'header': ['Orbitron', 'sans-serif'],
                        'mono': ['Share Tech Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            background-color: #0A0A0A;
        }

        .editor-textarea {
            font-family: 'Share Tech Mono', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            tab-size: 4;
            background-color: #0A0A0A;
            color: #D4AF37;
        }

        .terminal-output {
            font-family: 'Share Tech Mono', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #C41E3A;
            border-radius: 4px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #A0182E;
        }

        .file-item:hover {
            background: rgba(196, 30, 58, 0.1);
        }

        .file-item.active {
            background: rgba(196, 30, 58, 0.2);
            border-left: 3px solid #C41E3A;
        }

        .tab-item {
            transition: all 0.2s;
        }

        .tab-item.active {
            background: #C41E3A;
            color: #0A0A0A;
        }

        .ai-message {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        pre[class*="language-"] {
            margin: 0;
            border-radius: 4px;
        }

        .resizer {
            cursor: col-resize;
            width: 4px;
            background: transparent;
            transition: background 0.2s;
        }

        .resizer:hover {
            background: #C41E3A;
        }

        .imperial-border {
            border: 1px solid #D4AF37;
        }

        .imperial-border-bottom {
            border-bottom: 1px solid #D4AF37;
        }

        .imperial-border-top {
            border-top: 1px solid #D4AF37;
        }

        .imperial-border-right {
            border-right: 1px solid #D4AF37;
        }

        .imperial-bg {
            background: linear-gradient(135deg, #1A1A1A 0%, #0A0A0A 100%);
        }

        .header-bg {
            background: linear-gradient(90deg, #0A0A0A 0%, #1A1A1A 50%, #0A0A0A 100%);
            border-bottom: 1px solid #D4AF37;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
        }

        .sidebar-bg {
            background: linear-gradient(180deg, #0A0A0A 0%, #1A1A1A 100%);
            border-right: 1px solid #D4AF37;
        }

        .button-primary {
            background: linear-gradient(135deg, #C41E3A 0%, #A0182E 100%);
            color: #0A0A0A;
            border: 1px solid #D4AF37;
            font-weight: bold;
        }

        .button-primary:hover {
            background: linear-gradient(135deg, #A0182E 0%, #801224 100%);
        }

        .button-secondary {
            background: linear-gradient(135deg, #D4AF37 0%, #B8941F 100%);
            color: #0A0A0A;
            border: 1px solid #D4AF37;
            font-weight: bold;
        }

        .button-secondary:hover {
            background: linear-gradient(135deg, #B8941F 0%, #987A0F 100%);
        }

        .terminal-bg {
            background-color: #0A0A0A;
            color: #00FF00;
            border-top: 1px solid #D4AF37;
        }

        .aquila-icon {
            color: #D4AF37;
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.7);
        }

        .skull-icon {
            color: #C41E3A;
        }

        .pulse-glow {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 5px rgba(196, 30, 58, 0.5);
            }
            50% {
                box-shadow: 0 0 20px rgba(196, 30, 58, 0.8);
            }
            100% {
                box-shadow: 0 0 5px rgba(196, 30, 58, 0.5);
            }
        }

        .music-button {
            transition: all 0.3s ease;
        }

        .music-button.playing {
            background: linear-gradient(135deg, #D4AF37 0%, #B8941F 100%);
            color: #0A0A0A;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body class="imperial-bg text-gray-300">

    <!-- Audio Element -->
    <audio id="backgroundMusic" loop>
        <source src="Warhammer 40,000 Mechanicus OST - Children of the Omnissiah[Extended] [ztzq05IzYds].mp3" type="audio/mpeg">
        Seu navegador não suporta o elemento de áudio.
    </audio>

    <!-- Header -->
    <header class="h-14 header-bg flex items-center justify-between px-4">
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <i class="fas fa-skull skull-icon text-2xl"></i>
                <h1 class="text-xl font-header font-bold text-secondary">CODEX MECHANICUS</h1>
                <span class="text-xs text-primary font-mono">// FORGE WORLD IDE</span>
            </div>
            <div class="hidden md:flex items-center space-x-2 text-sm">
                <button onclick="app.newFile()" class="px-3 py-1.5 button-primary rounded transition">
                    <i class="fas fa-file-plus mr-1"></i> NOVO COGNOM
                </button>
                <button onclick="app.saveFile()" class="px-3 py-1.5 button-secondary rounded transition">
                    <i class="fas fa-save mr-1"></i> SALVAR NO DATASLATE
                </button>
                <button onclick="app.runCode()" class="px-3 py-1.5 button-primary rounded transition">
                    <i class="fas fa-play mr-1"></i> EXECUTAR RITUAL
                </button>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <select onchange="app.changeLanguage(this.value)" class="px-3 py-1.5 bg-dark-surface imperial-border rounded text-base text-secondary">
                <option value="javascript">Binary Cant</option>
                <option value="python">Techna-Lingua</option>
                <option value="html">Noosphere Markup</option>
                <option value="css">Cogitator Styling</option>
                <option value="typescript">High Gothic Script</option>
                <option value="json">Data-Tome Format</option>
            </select>
            
            <!-- Music Toggle Button -->
            <button id="musicToggle" onclick="app.toggleMusic()" class="music-button p-2 rounded hover:bg-dark-elevated transition imperial-border" title="Toggle Background Music">
                <i class="fas fa-volume-mute text-secondary"></i>
            </button>
            
            <button onclick="app.toggleTheme()" class="p-2 rounded hover:bg-dark-elevated transition imperial-border">
                <i class="fas fa-moon text-secondary"></i>
            </button>
            <button onclick="app.showApiConfig()" class="p-2 rounded hover:bg-dark-elevated transition imperial-border" title="Configurar API">
                <i class="fas fa-key text-secondary"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex h-[calc(100vh-3.5rem)]">

        <!-- Sidebar - File Explorer -->
        <aside id="sidebar" class="w-64 sidebar-bg flex flex-col">
            <div class="p-3 imperial-border-bottom">
                <h2 class="font-semibold text-sm flex items-center text-secondary">
                    <i class="fas fa-cogs aquila-icon mr-2"></i>
                    COGNOM REPOSITORIUM
                </h2>
            </div>
            <div id="fileList" class="flex-1 overflow-y-auto scrollbar-thin p-2">
                <!-- Files will be listed here -->
            </div>
            <div class="p-3 imperial-border-top">
                <button onclick="app.showTemplates()" class="w-full px-3 py-2 button-primary rounded transition text-sm">
                    <i class="fas fa-hammer mr-2"></i>STC TEMPLATES
                </button>
            </div>
        </aside>

        <!-- Resizer -->
        <div class="resizer" id="resizer"></div>

        <!-- Editor Area -->
        <main class="flex-1 flex flex-col min-w-0">

            <!-- Tabs -->
            <div id="tabs" class="flex items-center bg-dark-elevated imperial-border-bottom overflow-x-auto scrollbar-thin">
                <!-- Tabs will be added here -->
            </div>

            <!-- Editor -->
            <div class="flex-1 relative">
                <textarea
                    id="editor"
                    class="editor-textarea w-full h-full p-4 border-none outline-none scrollbar-thin"
                    spellcheck="false"
                    placeholder="INITIATE COGNOM... OR CONSULT THE TECH-PRIEST FOR GUIDANCE!"
                ></textarea>
            </div>

            <!-- Bottom Panel - Terminal/Preview/AI -->
            <div class="h-80 imperial-border-top flex flex-col">
                <div class="flex bg-dark-elevated imperial-border-bottom">
                    <button onclick="app.switchPanel('terminal')" class="tab-item px-4 py-2 text-sm font-medium imperial-border-right" data-panel="terminal">
                        <i class="fas fa-terminal mr-2 text-secondary"></i>Vox-Caster
                    </button>
                    <button onclick="app.switchPanel('preview')" class="tab-item px-4 py-2 text-sm font-medium imperial-border-right" data-panel="preview">
                        <i class="fas fa-eye mr-2 text-secondary"></i>Hololith Display
                    </button>
                    <button onclick="app.switchPanel('ai')" class="tab-item active px-4 py-2 text-sm font-medium" data-panel="ai">
                        <i class="fas fa-robot mr-2 text-secondary"></i>Tech-Priest Consultation
                    </button>
                </div>

                <!-- Terminal Panel -->
                <div id="terminal-panel" class="hidden flex-1 flex flex-col terminal-bg">
                    <div id="terminalOutput" class="terminal-output flex-1 overflow-y-auto scrollbar-thin p-4"></div>
                    <div class="flex items-center p-2 imperial-border-top">
                        <span class="mr-2 text-secondary">MACHINE SPIRIT></span>
                        <input
                            type="text"
                            id="terminalInput"
                            class="flex-1 bg-transparent border-none outline-none text-base text-green-400 px-2"
                            placeholder="INPUT IMPERATIVE..."
                        >
                    </div>
                </div>

                <!-- Preview Panel -->
                <div id="preview-panel" class="hidden flex-1 imperial-bg">
                    <iframe id="previewFrame" class="w-full h-full border-none"></iframe>
                </div>

                <!-- AI Assistant Panel -->
                <div id="ai-panel" class="flex-1 flex flex-col bg-dark-surface">
                    <div id="aiChat" class="flex-1 overflow-y-auto scrollbar-thin p-4 space-y-4"></div>
                    <div class="p-4 imperial-border-top">
                        <div class="flex space-x-2">
                            <input
                                type="text"
                                id="aiInput"
                                class="flex-1 px-4 py-2 imperial-border rounded-lg bg-dark-bg text-base text-secondary"
                                placeholder="PETITION THE TECH-PRIEST: 'CONSTRUCT A FUNCTION FOR...', 'ELUCIDATE THIS COGNOM', ETC."
                            >
                            <button onclick="app.sendToAI()" class="px-6 py-2 button-primary rounded-lg transition">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                        <div class="flex flex-wrap gap-2 mt-2">
                            <button onclick="app.quickAI('Elucidate this cognom')" class="px-3 py-1 text-xs bg-dark-elevated imperial-border rounded hover:bg-dark-border transition">
                                Elucidate Cognom
                            </button>
                            <button onclick="app.quickAI('Optimize this cognom')" class="px-3 py-1 text-xs bg-dark-elevated imperial-border rounded hover:bg-dark-border transition">
                                Optimize
                            </button>
                            <button onclick="app.quickAI('Locate malfunctions in this cognom')" class="px-3 py-1 text-xs bg-dark-elevated imperial-border rounded hover:bg-dark-border transition">
                                Locate Malfunctions
                            </button>
                            <button onclick="app.quickAI('Add sacred annotations')" class="px-3 py-1 text-xs bg-dark-elevated imperial-border rounded hover:bg-dark-border transition">
                                Sacred Annotations
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Templates Modal -->
    <div id="templatesModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
        <div class="imperial-bg imperial-border rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-hidden pulse-glow">
            <div class="p-6 imperial-border-bottom flex justify-between items-center">
                <h2 class="text-2xl font-header font-bold text-secondary">STC TEMPLATES</h2>
                <button onclick="app.hideTemplates()" class="text-secondary hover:text-primary">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto scrollbar-thin" style="max-height: calc(90vh - 80px);">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Templates will be added here -->
                </div>
            </div>
        </div>
    </div>

    <!-- API Configuration Modal -->
    <div id="apiConfigModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
        <div class="imperial-bg imperial-border rounded-lg shadow-xl max-w-md w-full pulse-glow">
            <div class="p-6 imperial-border-bottom flex justify-between items-center">
                <h2 class="text-2xl font-header font-bold text-secondary">API CONFIGURATION</h2>
                <button onclick="app.hideApiConfig()" class="text-secondary hover:text-primary">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-secondary mb-2">DeepSeek API Key</label>
                    <input 
                        type="password" 
                        id="apiKeyInput" 
                        class="w-full px-4 py-2 imperial-border rounded bg-dark-bg text-base text-secondary"
                        placeholder="Enter your DeepSeek API key"
                    >
                    <p class="text-xs text-gray-400 mt-1">
                        Your API key is stored locally in your browser and never sent to our servers.
                    </p>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-secondary mb-2">API Base URL</label>
                    <input 
                        type="text" 
                        id="apiUrlInput" 
                        class="w-full px-4 py-2 imperial-border rounded bg-dark-bg text-base text-secondary"
                        value="https://api.deepseek.com/v1"
                        placeholder="https://api.deepseek.com/v1"
                    >
                </div>
                <div class="flex justify-between items-center">
                    <button onclick="app.testApiConnection()" class="px-4 py-2 button-secondary rounded transition">
                        Test Connection
                    </button>
                    <div class="flex space-x-2">
                        <button onclick="app.hideApiConfig()" class="px-4 py-2 text-gray-400 hover:bg-dark-elevated rounded imperial-border">
                            Cancel
                        </button>
                        <button onclick="app.saveApiConfig()" class="px-4 py-2 button-primary rounded transition">
                            Save Configuration
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize dark mode
        document.documentElement.classList.add('dark');

        const app = {
            currentFile: null,
            currentLanguage: 'javascript',
            files: {},
            fileCounter: 0,
            activePanel: 'ai',
            terminalHistory: [],
            terminalHistoryIndex: -1,
            apiConfig: {
                key: '',
                baseUrl: 'https://api.deepseek.com/v1',
                model: 'deepseek-chat'
            },
            isMusicPlaying: false,

            init() {
                // Load API configuration from localStorage
                this.loadApiConfig();
                
                // Create welcome file
                this.createFile('initiation-cant.js', `// INITIATION CANT - CODEX MECHANICUS 🛠️
// A FORGE WORLD IDE FOR THE IMPERIUM OF MAN

// FUNCTIONALITIES:
// ✅ Cognom Editor with Binary Cant Highlighting
// ✅ Virtual Dataslate System
// ✅ Integrated Vox-Caster
// ✅ Hololith Display for HTML/CSS/JS Applications
// ✅ Tech-Priest Consultation for Cognom Assistance
// ✅ STC Templates
// ✅ Support for Multiple Lingua-Technas

// Begin by creating a new cognom or using an STC template!
// Consult the Tech-Priest for cognom assistance.

function imperialGreeting() {
    console.log("The Emperor Protects!");
    return "Cognom sequence initiated. 💀";
}

imperialGreeting();
`, 'javascript');

                this.openFile('initiation-cant.js');
                this.setupEditor();
                this.setupResizer();
                this.setupEventListeners();
                this.addWelcomeAIMessage();
                this.addWelcomeTerminalMessage();
            },

            setupEventListeners() {
                // Terminal input event listener - CORREÇÃO DO BUG
                const terminalInput = document.getElementById('terminalInput');
                terminalInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.executeCommand(terminalInput.value);
                        terminalInput.value = '';
                    }
                });

                // AI input event listener
                const aiInput = document.getElementById('aiInput');
                aiInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendToAI();
                    }
                });

                // Setup terminal input history navigation
                this.setupTerminalInput();
            },

            loadApiConfig() {
                const savedConfig = localStorage.getItem('deepseekApiConfig');
                if (savedConfig) {
                    this.apiConfig = { ...this.apiConfig, ...JSON.parse(savedConfig) };
                }
            },

            saveApiConfig() {
                localStorage.setItem('deepseekApiConfig', JSON.stringify(this.apiConfig));
                this.showNotification('API configuration saved!');
                this.hideApiConfig();
            },

            setupEditor() {
                const editor = document.getElementById('editor');
                editor.addEventListener('input', () => {
                    if (this.currentFile) {
                        this.files[this.currentFile].content = editor.value;
                    }
                });

                // Tab support
                editor.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        const start = editor.selectionStart;
                        const end = editor.selectionEnd;
                        editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                        editor.selectionStart = editor.selectionEnd = start + 4;
                    }
                });
            },

            setupResizer() {
                const resizer = document.getElementById('resizer');
                const sidebar = document.getElementById('sidebar');
                let isResizing = false;

                resizer.addEventListener('mousedown', (e) => {
                    isResizing = true;
                    document.body.style.cursor = 'col-resize';
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isResizing) return;
                    const newWidth = e.clientX;
                    if (newWidth >= 200 && newWidth <= 500) {
                        sidebar.style.width = newWidth + 'px';
                    }
                });

                document.addEventListener('mouseup', () => {
                    isResizing = false;
                    document.body.style.cursor = 'default';
                });
            },

            setupTerminalInput() {
                const terminalInput = document.getElementById('terminalInput');
                
                terminalInput.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (this.terminalHistoryIndex > 0) {
                            this.terminalHistoryIndex--;
                            terminalInput.value = this.terminalHistory[this.terminalHistoryIndex];
                        }
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (this.terminalHistoryIndex < this.terminalHistory.length - 1) {
                            this.terminalHistoryIndex++;
                            terminalInput.value = this.terminalHistory[this.terminalHistoryIndex];
                        } else {
                            this.terminalHistoryIndex = this.terminalHistory.length;
                            terminalInput.value = '';
                        }
                    }
                });
            },

            toggleMusic() {
                const music = document.getElementById('backgroundMusic');
                const musicButton = document.getElementById('musicToggle');
                const icon = musicButton.querySelector('i');
                
                if (this.isMusicPlaying) {
                    music.pause();
                    icon.classList.remove('fa-volume-up');
                    icon.classList.add('fa-volume-mute');
                    musicButton.classList.remove('playing');
                    this.showNotification('Sacred hymns silenced');
                } else {
                    music.play().catch(e => {
                        console.error('Error playing music:', e);
                        this.showNotification('Error: Could not play sacred hymns');
                    });
                    icon.classList.remove('fa-volume-mute');
                    icon.classList.add('fa-volume-up');
                    musicButton.classList.add('playing');
                    this.showNotification('Sacred hymns activated');
                }
                
                this.isMusicPlaying = !this.isMusicPlaying;
            },

            createFile(name, content = '', language = 'javascript') {
                this.files[name] = {
                    name,
                    content,
                    language
                };
                this.renderFileList();
            },

            newFile() {
                const name = this.showPromptDialog('Designation for new cognom:', `cognom${++this.fileCounter}.${this.getExtension(this.currentLanguage)}`);
                if (!name) return;

                if (this.files[name]) {
                    this.showAlertDialog('A cognom with this designation already exists in the repository!');
                    return;
                }

                this.createFile(name, '', this.currentLanguage);
                this.openFile(name);
            },

            openFile(name) {
                if (!this.files[name]) return;

                this.currentFile = name;
                const file = this.files[name];

                document.getElementById('editor').value = file.content;
                this.currentLanguage = file.language;

                // Update language selector
                document.querySelector('select').value = file.language;

                this.renderFileList();
                this.renderTabs();
            },

            saveFile() {
                if (!this.currentFile) return;

                const content = document.getElementById('editor').value;
                this.files[this.currentFile].content = content;

                this.addTerminalLine(`✓ Cognom '${this.currentFile}' successfully archived to dataslate!`, 'text-green-400');
                this.showNotification('Cognom archived!');
            },

            deleteFile(name) {
                this.showConfirmDialog(`Do you wish to purge '${name}' from the repository?`, () => {
                    delete this.files[name];

                            output += args.map(arg =>

                            ).join(' ') + '\n';
                            originalConsoleLog.apply(console, args);
                        };
                        
                        const result = eval(code);
                        
                        // Restore original console.log
                        console.log = originalConsoleLog;
                        
                        this.addTerminalLine(`✓ Ritual executed successfully`, 'text-green-400');

                        this.addTerminalLine('Repository Contents:', 'text-yellow-400');
                        Object.keys(this.files).forEach(name => {
                            this.addTerminalLine(`  ${name}`, 'text-blue-400');
                        });
                        break;
                    case 'display':
                        if (parts[1] && this.files[parts[1]]) {
                            this.addTerminalLine(`Content of ${parts[1]}:`, 'text-yellow-400');
                            this.addTerminalLine(this.files[parts[1]].content, 'text-gray-300');
                        } else {
                            this.addTerminalLine('Cognom not found in repository', 'text-red-400');
                        }
                        break;
                    case 'run':
                        this.runCode();
                        break;
                    case 'save':
                        this.saveFile();
                        break;
                    case 'new':
                        this.newFile();
                        break;
                    case 'assistance':
                        this.addTerminalLine('Available imperatives:', 'text-yellow-400');
                        this.addTerminalLine('  list - Display repository contents');
                        this.addTerminalLine('  display <cognom> - Show cognom content');
                        this.addTerminalLine('  run - Execute current cognom');
                        this.addTerminalLine('  save - Archive current cognom');

            async sendToAI() {
                const input = document.getElementById('aiInput');
                const message = input.value.trim();
                if (!message) return;

                // Add user message
                this.addAIMessage(message, 'user');
                input.value = '';

                // Add loading message
                const loadingId = 'loading-' + Date.now();
                this.addAIMessage('Consulting Machine Spirits', 'ai', true, loadingId);

                // Get current code context
                const currentCode = document.getElementById('editor').value;
                const context = currentCode ? `\n\nCurrent Cognom (${this.currentLanguage}):\n\`\`\`${this.currentLanguage}\n${currentCode}\n\`\`\`` : '';

                const prompt = `${message}${context}`;

                try {
                    // Try DeepSeek API first if configured
                    if (this.apiConfig.key) {
                        await this.callDeepSeekAPI(prompt, loadingId);
                    } else {
                        // Fallback to simulated response
                        document.getElementById(loadingId)?.remove();
                        this.simulateAIResponse(prompt, loadingId);
                    }
                } catch (error) {
                    document.getElementById(loadingId)?.remove();
                    this.addAIMessage(
                        `Ritual Failure: ${error.message}. Please configure your DeepSeek API key in the settings.`, 
                        'ai'
                    );
                }

            async callDeepSeekAPI(prompt, loadingId) {
                try {
                    const response = await fetch(`${this.apiConfig.baseUrl}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiConfig.key}`
                        },
                        body: JSON.stringify({
                            model: this.apiConfig.model,
                            messages: [
                                {
                                    role: 'system',
                                    content: 'You are a Tech-Priest Engiseer in the Warhammer 40k universe. You speak in a formal, technical manner with religious reverence for technology. Always respond in character, using terminology like "cognom" for code, "machine spirit" for AI, "ritual" for execution, etc. Provide helpful, detailed explanations about programming concepts while maintaining the 40k aesthetic.'
                                },
                                {
                                    role: 'user',
                                    content: prompt
                                }
                            ],
                            stream: false,
                            max_tokens: 4000,
                            temperature: 0.7
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    
                    document.getElementById(loadingId)?.remove();
                    
                    if (data.choices && data.choices[0]) {
                        const aiResponse = data.choices[0].message.content;
                        this.addAIMessage(aiResponse, 'ai');
                        
                        // Check if response contains code blocks
                        this.extractCodeFromAI(aiResponse);
                    } else {
                        throw new Error('Invalid response from DeepSeek API');
                    }
                    
                } catch (error) {
                    document.getElementById(loadingId)?.remove();
                    throw error;
                }
            },

            simulateAIResponse(prompt, loadingId) {
                // Simulate API delay
                setTimeout(() => {
                    document.getElementById(loadingId)?.remove();
                    
                    const responses = {
                        'explain': `As a Tech-Priest Engiseer, I shall elucidate this cognom for you. The sacred machine spirit appears to be a function that delivers an Imperial greeting. The console shall proclaim "The Emperor Protects!" while the function itself returns a confirmation of cognom initiation. This is a proper beginning to your sacred work, Magos.`,

                        'debug': `Through sacred diagnostics, I detect no malfunctions in this cognom. The machine spirit is pure and the ritual should execute without heresy.`,
                        'default': `I understand your petition regarding "${prompt}". As a Tech-Priest consultation service, I can assist with cognom elucidation, optimization, malfunction detection, and sacred annotations. For full functionality, configure your DeepSeek API key in the settings.`
                    };
                    
                    let response = responses.default;
                    const lowerPrompt = prompt.toLowerCase();
                    
                    if (lowerPrompt.includes('explain') || lowerPrompt.includes('elucidate')) {
                        response = responses.explain;
                    } else if (lowerPrompt.includes('optimize')) {
                        response = responses.optimize;
                    } else if (lowerPrompt.includes('debug') || lowerPrompt.includes('malfunction')) {
                        response = responses.debug;
                    }
                    
                    this.addAIMessage(response, 'ai');
                    this.extractCodeFromAI(response);
                }, 1500);
            },

                let result = null;
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50';
                modal.innerHTML = `
                    <div class="imperial-bg imperial-border p-6 rounded-lg shadow-xl max-w-md w-full mx-4 pulse-glow">
                        <p class="text-gray-300 mb-4">${message}</p>
                        <input type="text" value="${defaultValue}" class="w-full px-4 py-2 imperial-border rounded bg-dark-bg text-secondary text-base mb-4">
                        <div class="flex justify-end space-x-3">
                            <button class="cancel px-4 py-2 text-gray-400 hover:bg-dark-elevated rounded imperial-border">
                                ABORT
                            </button>
                            <button class="confirm px-4 py-2 button-primary rounded">
                                CONFIRM
                            </button>
                        </div>
                    </div>
                `;

                document.body.appendChild(modal);

                const input = modal.querySelector('input');
                input.focus();
                input.select();

                return new Promise((resolve) => {
                    const cleanup = () => {
                        modal.remove();
                    };

                    modal.querySelector('.cancel').onclick = () => {
                        cleanup();
                        resolve(null);
                    };

                    modal.querySelector('.confirm').onclick = () => {
                        const value = input.value;
                        cleanup();
                        resolve(value);
                    };

                    input.onkeypress = (e) => {
                        if (e.key === 'Enter') {
                            const value = input.value;
                            cleanup();
                            resolve(value);
                        }
                    };
                });
            }
        };

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
